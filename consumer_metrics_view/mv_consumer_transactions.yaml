version: 1.1
comment: "customer_facing transaction fields and currency-safe measures for an authenticated bank-app customer."
source: g3_catalog.gold.fact_consumer_transaction
parameters:
  - {name: scope_customer_id, data_type: string}
  - {name: scope_account_id, data_type: string, default: "'__all_owned__'"}
  - {name: scope_card_id, data_type: string, default: "'__all_owned__'"}
filter: >
  source.customer_id = scope_customer_id
  AND (
    scope_account_id = '__all_owned__'
    OR source.account_id = scope_account_id
  )
  AND (
    scope_card_id = '__all_owned__'
    OR source.card_id = scope_card_id
  )
fields:
  - {name: transaction_reference, expr: source.transaction_reference, comment: Masked transaction reference.}
  - {name: account_reference, expr: source.account_reference, comment: Masked account reference.}
  - {name: card_reference, expr: source.card_reference, comment: Masked card reference when applicable.}
  - {name: merchant_name, expr: source.merchant_name, comment: Merchant display name.}
  - {name: merchant_category, expr: source.merchant_category, comment: Merchant category.}
  - {name: merchant_country, expr: source.merchant_country, comment: Merchant country.}
  - {name: channel, expr: source.channel, comment: Transaction channel.}
  - {name: currency_code, expr: source.currency_code, comment: Currency required for amount aggregation.}
  - {name: transaction_at, expr: source.transaction_at, comment: Transaction timestamp.}
  - {name: transaction_status, expr: source.transaction_status, comment: Transaction status.}
  - {name: amount, expr: source.amount, comment: Transaction amount in currency_code.}
  - {name: quality_status, expr: source.quality_status, comment: Data quality outcome.}
  - {name: data_as_of, expr: source.last_refreshed_at, comment: Time the customer data was refreshed.}
measures:
  - {name: transaction_count, expr: COUNT(1), comment: Number of scoped transactions.}
  - {name: total_transaction_amount, expr: SUM(source.amount), comment: Total amount; group or filter by currency_code.}
  - {name: average_transaction_amount, expr: AVG(source.amount), comment: Average amount; group or filter by currency_code.}
