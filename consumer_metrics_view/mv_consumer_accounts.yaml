version: 1.1
comment: "customer_facing account fields and measures for an authenticated bank-app customer."
source: g3_catalog.gold.dim_consumer_account
parameters:
  - {name: scope_customer_id, data_type: string}
  - {name: scope_account_id, data_type: string, default: "'__all_owned__'"}
filter: >
  source.customer_id = scope_customer_id
  AND (
    scope_account_id = '__all_owned__'
    OR source.account_id = scope_account_id
  )
fields:
  - {name: account_reference, expr: source.account_reference, comment: Masked account reference.}
  - {name: product_type, expr: source.product_type, comment: Account product type.}
  - {name: account_status, expr: source.account_status, comment: Current account status.}
  - {name: currency_code, expr: source.currency_code, comment: Account currency code.}
  - {name: open_date, expr: source.open_date, comment: Date the account was opened.}
  - {name: quality_status, expr: source.quality_status, comment: Data quality outcome.}
  - {name: data_as_of, expr: source.last_refreshed_at, comment: Time the customer data was refreshed.}
measures:
  - {name: account_count, expr: COUNT(1), comment: Number of scoped accounts.}
  - {name: active_account_count, expr: "COUNT(1) FILTER (WHERE source.account_status = 'active')", comment: Number of active scoped accounts.}
