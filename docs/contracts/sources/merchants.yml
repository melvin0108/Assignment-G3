schema_version: "1.0.0"
dataset: merchants
layer: source_to_silver
source: data/raw/merchants.csv
purpose: "Mock source dataset for merchants."
grain: "one row per merchant"
primary_key: ["merchant_id"]
contractual_type_layer: silver
failure_handling: {default_disposition: quarantined, destination: silver.quarantine_records}
fields:
  - {name: "merchant_id", type: "string", required: true, example: "MCH-0001", classification: "internal", rules: []}
  - {name: "name", type: "string", required: true, example: "example", classification: "internal", rules: []}
  - {name: "mcc", type: "string", required: true, example: "example", classification: "internal", rules: [], references: "merchant_categories.mcc"}
  - {name: "country", type: "string", required: true, example: "example", classification: "internal", rules: [], references: "countries.iso_code"}
  - {name: "risk_rating", type: "string", required: true, example: "low", classification: "internal", rules: ["DQ-MERCH-RISK-CASING"], accepted_values: ["low", "medium", "high"]}
  - {name: "status", type: "string", required: true, example: "active", classification: "internal", rules: [], accepted_values: ["active", "suspended", "closed"]}
  - {name: "effective_at", type: "timestamp", required: true, example: "2026-07-06T10:00:00Z", classification: "internal", rules: ["DQ-MERCH-EFFECTIVE-TYPE"]}
