schema_version: "1.0.0"
model: fact_consumer_transaction
table: gold.fact_consumer_transaction
description: Protected customer-owned transaction broker without raw transaction identifiers.
domain: consumer_self_service
type: fact
grain: one row per customer and masked transaction reference
tags: [gold, consumer, protected_broker_source]
synonyms: [consumer transaction, my transaction]
sources: [silver.transactions, gold.dim_consumer_account, gold.dim_consumer_card, silver.merchants, silver.merchant_categories]
ai_access: {classification: internal_only, pii_safe: true}
primary_key: [customer_id, transaction_reference]
relationships:
  - target_model: gold.dim_consumer_account
    cardinality: many_to_one
    join_columns: [{from: customer_id, to: customer_id}, {from: account_id, to: account_id}]
columns:
  - {name: customer_id, physical_type: string, description: Internal customer scope key; never returned to the agent., semantic_role: broker_key, tags: [restricted], synonyms: [customer scope]}
  - {name: account_id, physical_type: string, description: Internal account scope key; never returned to the agent., semantic_role: broker_key, tags: [restricted], synonyms: [account scope]}
  - {name: card_id, physical_type: string, description: Internal nullable card scope key; never returned to the agent., semantic_role: broker_key, tags: [restricted], synonyms: [card scope]}
  - {name: transaction_reference, physical_type: string, description: Masked customer-visible transaction reference., semantic_role: primary_key, tags: [masked], synonyms: [transaction]}
  - {name: account_reference, physical_type: string, description: Masked account display reference., semantic_role: dimension, tags: [masked], synonyms: [account]}
  - {name: card_reference, physical_type: string, description: Masked nullable card display reference., semantic_role: dimension, tags: [masked], synonyms: [card]}
  - {name: merchant_name, physical_type: string, description: Merchant display name., semantic_role: dimension, tags: [], synonyms: [merchant]}
  - {name: merchant_category, physical_type: string, description: Merchant category description., semantic_role: dimension, tags: [], synonyms: [category]}
  - {name: merchant_country, physical_type: string, description: Merchant country code., semantic_role: dimension, tags: [], synonyms: [country]}
  - {name: channel, physical_type: string, description: Transaction channel., semantic_role: dimension, tags: [], synonyms: [payment channel]}
  - {name: currency_code, physical_type: string, description: Transaction currency; monetary metrics must group or filter by it., semantic_role: dimension, tags: [currency], synonyms: [currency]}
  - {name: transaction_at, physical_type: timestamp, description: Transaction timestamp., semantic_role: time, tags: [], synonyms: [transaction time]}
  - {name: transaction_status, physical_type: string, description: Transaction status., semantic_role: dimension, tags: [], synonyms: [status]}
  - {name: amount, physical_type: "decimal(18,2)", description: Transaction amount in currency_code., semantic_role: measure, tags: [amount, currency], synonyms: [transaction amount]}
  - {name: pipeline_run_id, physical_type: string, description: Gold pipeline run identifier., semantic_role: lineage, tags: [metadata], synonyms: [run id]}
  - {name: batch_id, physical_type: bigint, description: Source snapshot batch identifier., semantic_role: lineage, tags: [metadata], synonyms: [batch]}
  - {name: last_refreshed_at, physical_type: timestamp, description: Time the Gold row was refreshed., semantic_role: time, tags: [metadata], synonyms: [data as of]}
  - {name: quality_status, physical_type: string, description: Row quality outcome., semantic_role: quality_flag, tags: [metadata], synonyms: [data quality], allowed_values: [pass, partial]}
  - {name: warning_flags, physical_type: "array<string>", description: Machine-readable data quality warnings., semantic_role: quality_flag, tags: [metadata], synonyms: [warnings]}
  - {name: source_references, physical_type: "array<struct<source_table:string,source_record_id:string>>", description: Protected source lineage., semantic_role: lineage, tags: [metadata, restricted], synonyms: [lineage]}
  - {name: usage_restrictions, physical_type: string, description: Broker source access classification., semantic_role: access_policy, tags: [metadata], synonyms: [access policy], allowed_values: [internal_only]}
dimensions:
  - {id: currency_code, column: currency_code, description: Required grouping for monetary aggregation., synonyms: [currency]}
  - {id: transaction_status, column: transaction_status, description: Transaction status., synonyms: [status]}
  - {id: transaction_at, column: transaction_at, description: Transaction timestamp., synonyms: [transaction time]}
metrics:
  - {id: transaction_count, description: Number of scoped transactions., expression: "COUNT(1)", aggregation: count, format: integer, supported_dimensions: [currency_code, transaction_status, transaction_at], time_field: transaction_at}
  - {id: total_transaction_amount, description: Total transaction amount; group or filter by currency_code., expression: "SUM(amount)", aggregation: sum, format: currency_by_currency_code, supported_dimensions: [currency_code, transaction_status, transaction_at], time_field: transaction_at}
  - {id: average_transaction_amount, description: Average transaction amount; group or filter by currency_code., expression: "AVG(amount)", aggregation: average, format: currency_by_currency_code, supported_dimensions: [currency_code, transaction_status, transaction_at], time_field: transaction_at}
