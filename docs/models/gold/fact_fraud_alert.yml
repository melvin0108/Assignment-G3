schema_version: "1.0.0"
model: fact_fraud_alert
table: gold.fact_fraud_alert
description: Fraud alerts for transactions linked to eligible investigation cases.
domain: transaction_investigation
type: fact
grain: one row per case_id and alert_id
tags: [gold, fraud_alert, ai_safe]
synonyms: [fraud alert, cảnh báo gian lận]
sources: [silver.fraud_alerts, silver.case_transactions]
ai_access: {classification: internal_only, pii_safe: true}
primary_key: [case_id, alert_id]
relationships:
  - {target_model: gold.dim_case, cardinality: many_to_one, join_columns: [{from: case_id, to: case_id}]}
  - {target_model: gold.dim_date, cardinality: many_to_one, join_columns: [{from: triggered_date_key, to: date_key}]}
columns:
  - {name: case_id, physical_type: string, description: Natural investigation case identifier., semantic_role: primary_key, tags: [identifier], synonyms: [case, hồ sơ]}
  - {name: transaction_id, physical_type: string, description: Related transaction identifier., semantic_role: business_key, tags: [identifier], synonyms: [transaction, giao dịch]}
  - {name: alert_id, physical_type: string, description: Natural fraud-alert identifier., semantic_role: primary_key, tags: [identifier], synonyms: [alert, cảnh báo]}
  - {name: triggered_date_key, physical_type: int, description: yyyyMMdd alert date key; 0 means UNKNOWN., semantic_role: foreign_key, tags: [date], synonyms: [alert date]}
  - {name: rule_name, physical_type: string, description: Rule that triggered the alert., semantic_role: dimension, tags: [fraud_alert], synonyms: [alert rule, quy tắc]}
  - {name: score, physical_type: double, description: Fraud-alert score from zero to one., semantic_role: measure, tags: [fraud_alert], synonyms: [risk score, điểm cảnh báo]}
  - {name: disposition, physical_type: string, description: Recorded alert disposition., semantic_role: dimension, tags: [fraud_alert], synonyms: [outcome, xử lý]}
  - {name: triggered_at, physical_type: timestamp, description: Time the alert was triggered., semantic_role: time, tags: [fraud_alert], synonyms: [alert time]}
  - {name: pipeline_run_id, physical_type: string, description: Gold pipeline run identifier., semantic_role: lineage, tags: [metadata], synonyms: [run id]}
  - {name: batch_id, physical_type: bigint, description: Source snapshot batch identifier., semantic_role: lineage, tags: [metadata], synonyms: [batch]}
  - {name: last_refreshed_at, physical_type: timestamp, description: Time the Gold row was refreshed., semantic_role: time, tags: [metadata], synonyms: [refresh time]}
  - {name: quality_status, physical_type: string, description: Row quality outcome., semantic_role: quality_flag, tags: [metadata], synonyms: [data quality], allowed_values: [pass, partial]}
  - {name: warning_flags, physical_type: "array<string>", description: Machine-readable data quality warnings., semantic_role: quality_flag, tags: [metadata], synonyms: [warnings]}
  - {name: source_references, physical_type: "array<struct<source_table:string,source_record_id:string>>", description: Source records used to build the row., semantic_role: lineage, tags: [metadata], synonyms: [lineage]}
  - {name: usage_restrictions, physical_type: string, description: Consumer access classification., semantic_role: access_policy, tags: [metadata], synonyms: [AI access], allowed_values: [internal_only]}
dimensions:
  - {id: case_id, column: case_id, description: Investigation case., synonyms: [case, hồ sơ]}
  - {id: rule_name, column: rule_name, description: Alert rule., synonyms: [rule, quy tắc]}
  - {id: disposition, column: disposition, description: Alert disposition., synonyms: [outcome, xử lý]}
  - {id: triggered_date_key, column: triggered_date_key, description: Alert date., synonyms: [date, ngày cảnh báo]}
metrics:
  - {id: fraud_alert_count, description: Number of case-linked fraud alerts., expression: "COUNT(*)", aggregation: count, format: integer, supported_dimensions: [case_id, rule_name, disposition, triggered_date_key], time_field: triggered_at}
  - {id: fraud_alert_score_average, description: Average fraud-alert score., expression: "AVG(score)", aggregation: average, format: decimal_0_1, supported_dimensions: [case_id, rule_name, disposition, triggered_date_key], time_field: triggered_at}
