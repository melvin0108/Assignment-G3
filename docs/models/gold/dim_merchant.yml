schema_version: "1.0.0"
model: dim_merchant
table: gold.dim_merchant
description: Merchant reference data enriched with merchant-category attributes and an UNKNOWN member.
domain: transaction_investigation
type: dimension
grain: one row per merchant_id, plus the UNKNOWN member
tags: [gold, merchant, ai_safe]
synonyms: [merchant, người bán]
sources: [silver.merchants, silver.merchant_categories]
ai_access: {classification: internal_only, pii_safe: true}
primary_key: [merchant_id]
relationships: []
columns:
  - {name: merchant_id, physical_type: string, description: Natural merchant identifier; UNKNOWN represents unresolved enrichment., semantic_role: primary_key, tags: [identifier], synonyms: [merchant code, mã người bán]}
  - {name: merchant_name, physical_type: string, description: Business-facing merchant name., semantic_role: attribute, tags: [merchant], synonyms: [merchant, người bán]}
  - {name: mcc, physical_type: string, description: Merchant category code., semantic_role: dimension, tags: [merchant_category], synonyms: [MCC]}
  - {name: category_name, physical_type: string, description: Merchant category name., semantic_role: dimension, tags: [merchant_category], synonyms: [category, danh mục]}
  - {name: category_group, physical_type: string, description: Higher-level merchant category grouping., semantic_role: dimension, tags: [merchant_category], synonyms: [category group, nhóm danh mục]}
  - {name: country, physical_type: string, description: Merchant country code., semantic_role: dimension, tags: [geography], synonyms: [country, quốc gia]}
  - {name: risk_rating, physical_type: string, description: Merchant risk rating., semantic_role: dimension, tags: [risk], synonyms: [risk, rủi ro], allowed_values: [low, medium, high]}
  - {name: merchant_status, physical_type: string, description: Current merchant status., semantic_role: dimension, tags: [merchant], synonyms: [status, trạng thái]}
  - {name: effective_at, physical_type: timestamp, description: Time the current merchant record became effective., semantic_role: time, tags: [merchant], synonyms: [effective time]}
  - {name: is_unknown, physical_type: boolean, description: Whether this is the UNKNOWN merchant member., semantic_role: quality_flag, tags: [unknown_member], synonyms: [unknown merchant], allowed_values: [true, false]}
  - {name: pipeline_run_id, physical_type: string, description: Gold pipeline run identifier., semantic_role: lineage, tags: [metadata], synonyms: [run id]}
  - {name: batch_id, physical_type: bigint, description: Source snapshot batch identifier., semantic_role: lineage, tags: [metadata], synonyms: [batch]}
  - {name: last_refreshed_at, physical_type: timestamp, description: Time the Gold row was refreshed., semantic_role: time, tags: [metadata], synonyms: [refresh time]}
  - {name: quality_status, physical_type: string, description: Row quality outcome., semantic_role: quality_flag, tags: [metadata], synonyms: [data quality], allowed_values: [pass, partial]}
  - {name: warning_flags, physical_type: "array<string>", description: Machine-readable data quality warnings., semantic_role: quality_flag, tags: [metadata], synonyms: [warnings]}
  - {name: source_references, physical_type: "array<struct<source_table:string,source_record_id:string>>", description: Source records used to build the row., semantic_role: lineage, tags: [metadata], synonyms: [lineage]}
  - {name: usage_restrictions, physical_type: string, description: Consumer access classification., semantic_role: access_policy, tags: [metadata], synonyms: [AI access], allowed_values: [internal_only]}
dimensions:
  - {id: merchant_id, column: merchant_id, description: Merchant identifier., synonyms: [merchant, người bán]}
  - {id: mcc, column: mcc, description: Merchant category code., synonyms: [MCC]}
  - {id: category_name, column: category_name, description: Merchant category., synonyms: [category, danh mục]}
  - {id: category_group, column: category_group, description: Merchant category group., synonyms: [category group]}
  - {id: country, column: country, description: Merchant country., synonyms: [country, quốc gia]}
  - {id: risk_rating, column: risk_rating, description: Merchant risk rating., synonyms: [risk, rủi ro]}
  - {id: merchant_status, column: merchant_status, description: Merchant status., synonyms: [status, trạng thái]}
metrics: []
