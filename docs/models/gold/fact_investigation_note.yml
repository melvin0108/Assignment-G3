schema_version: "1.0.0"
model: fact_investigation_note
table: gold.fact_investigation_note
description: PII-screened investigation notes with author identity excluded.
domain: transaction_investigation
type: fact
grain: one row per case_id and note_id
tags: [gold, safe_note, ai_safe]
synonyms: [safe note, ghi chú an toàn]
sources: [silver.investigation_notes]
ai_access: {classification: internal_only, pii_safe: true}
primary_key: [case_id, note_id]
relationships:
  - {target_model: gold.dim_case, cardinality: many_to_one, join_columns: [{from: case_id, to: case_id}]}
  - {target_model: gold.dim_date, cardinality: many_to_one, join_columns: [{from: created_date_key, to: date_key}]}
columns:
  - {name: case_id, physical_type: string, description: Natural investigation case identifier., semantic_role: primary_key, tags: [identifier], synonyms: [case, hồ sơ]}
  - {name: note_id, physical_type: string, description: Natural investigation-note identifier., semantic_role: primary_key, tags: [identifier], synonyms: [note, ghi chú]}
  - {name: created_date_key, physical_type: int, description: yyyyMMdd note date key; 0 means UNKNOWN., semantic_role: foreign_key, tags: [date], synonyms: [note date]}
  - {name: safe_note_text, physical_type: string, description: PII-screened note text approved for AI use., semantic_role: text, tags: [safe_text], synonyms: [note text, nội dung ghi chú]}
  - {name: created_at, physical_type: timestamp, description: Time the note was created., semantic_role: time, tags: [safe_note], synonyms: [created time]}
  - {name: pipeline_run_id, physical_type: string, description: Gold pipeline run identifier., semantic_role: lineage, tags: [metadata], synonyms: [run id]}
  - {name: batch_id, physical_type: bigint, description: Source snapshot batch identifier., semantic_role: lineage, tags: [metadata], synonyms: [batch]}
  - {name: last_refreshed_at, physical_type: timestamp, description: Time the Gold row was refreshed., semantic_role: time, tags: [metadata], synonyms: [refresh time]}
  - {name: quality_status, physical_type: string, description: Row quality outcome., semantic_role: quality_flag, tags: [metadata], synonyms: [data quality], allowed_values: [pass, partial]}
  - {name: warning_flags, physical_type: "array<string>", description: Machine-readable data quality warnings., semantic_role: quality_flag, tags: [metadata], synonyms: [warnings]}
  - {name: source_references, physical_type: "array<struct<source_table:string,source_record_id:string>>", description: Source records used to build the row., semantic_role: lineage, tags: [metadata], synonyms: [lineage]}
  - {name: usage_restrictions, physical_type: string, description: Consumer access classification., semantic_role: access_policy, tags: [metadata], synonyms: [AI access], allowed_values: [internal_only]}
dimensions:
  - {id: case_id, column: case_id, description: Investigation case., synonyms: [case, hồ sơ]}
  - {id: created_date_key, column: created_date_key, description: Note creation date., synonyms: [date, ngày ghi chú]}
metrics:
  - {id: safe_note_count, description: Number of PII-screened notes., expression: "COUNT(*)", aggregation: count, format: integer, supported_dimensions: [case_id, created_date_key], time_field: created_at}
