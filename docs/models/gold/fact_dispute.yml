schema_version: "1.0.0"
model: fact_dispute
table: gold.fact_dispute
description: Disputes linked to eligible case transactions using natural business identifiers.
domain: transaction_investigation
type: fact
grain: one row per case_id and dispute_id
tags: [gold, dispute, ai_safe]
synonyms: [dispute, tranh chấp]
sources: [silver.disputes, silver.case_transactions, silver.transactions]
ai_access: {classification: ai_allowed, pii_safe: true}
primary_key: [case_id, dispute_id]
relationships:
  - {target_model: gold.dim_case, cardinality: many_to_one, join_columns: [{from: case_id, to: case_id}]}
  - {target_model: gold.dim_dispute_reason, cardinality: many_to_one, join_columns: [{from: reason_code, to: reason_code}]}
  - {target_model: gold.dim_currency, cardinality: many_to_one, join_columns: [{from: currency_code, to: currency_code}]}
  - {target_model: gold.dim_date, cardinality: many_to_one, join_columns: [{from: raised_date_key, to: date_key}]}
columns:
  - {name: case_id, physical_type: string, description: Natural investigation case identifier., semantic_role: primary_key, tags: [identifier], synonyms: [case, hồ sơ]}
  - {name: transaction_id, physical_type: string, description: Related transaction identifier., semantic_role: business_key, tags: [identifier], synonyms: [transaction, giao dịch]}
  - {name: dispute_id, physical_type: string, description: Natural dispute identifier., semantic_role: primary_key, tags: [identifier], synonyms: [dispute, tranh chấp]}
  - {name: reason_code, physical_type: string, description: Dispute reason code; UNKNOWN means unresolved enrichment., semantic_role: foreign_key, tags: [dispute], synonyms: [reason, lý do]}
  - {name: currency_code, physical_type: string, description: Dispute currency; monetary metrics must group or filter by it., semantic_role: foreign_key, tags: [currency], synonyms: [currency, tiền tệ]}
  - {name: raised_date_key, physical_type: int, description: yyyyMMdd dispute-raised date key; 0 means UNKNOWN., semantic_role: foreign_key, tags: [date], synonyms: [raised date]}
  - {name: amount, physical_type: "decimal(18,2)", description: Disputed amount in currency_code., semantic_role: measure, tags: [amount, currency], synonyms: [dispute amount, số tiền tranh chấp]}
  - {name: dispute_status, physical_type: string, description: Current dispute status., semantic_role: dimension, tags: [dispute], synonyms: [status, trạng thái]}
  - {name: raised_at, physical_type: timestamp, description: Time the dispute was raised., semantic_role: time, tags: [dispute], synonyms: [raised time]}
  - {name: pipeline_run_id, physical_type: string, description: Gold pipeline run identifier., semantic_role: lineage, tags: [metadata], synonyms: [run id]}
  - {name: batch_id, physical_type: bigint, description: Source snapshot batch identifier., semantic_role: lineage, tags: [metadata], synonyms: [batch]}
  - {name: last_refreshed_at, physical_type: timestamp, description: Time the Gold row was refreshed., semantic_role: time, tags: [metadata], synonyms: [refresh time]}
  - {name: quality_status, physical_type: string, description: Row quality outcome., semantic_role: quality_flag, tags: [metadata], synonyms: [data quality], allowed_values: [pass, partial]}
  - {name: warning_flags, physical_type: "array<string>", description: Machine-readable data quality warnings., semantic_role: quality_flag, tags: [metadata], synonyms: [warnings]}
  - {name: source_references, physical_type: "array<struct<source_table:string,source_record_id:string>>", description: Source records used to build the row., semantic_role: lineage, tags: [metadata], synonyms: [lineage]}
  - {name: usage_restrictions, physical_type: string, description: Consumer access classification., semantic_role: access_policy, tags: [metadata], synonyms: [AI access], allowed_values: [ai_allowed]}
dimensions:
  - {id: case_id, column: case_id, description: Investigation case., synonyms: [case, hồ sơ]}
  - {id: reason_code, column: reason_code, description: Dispute reason., synonyms: [reason, lý do]}
  - {id: currency_code, column: currency_code, description: Currency required for monetary aggregation., synonyms: [currency, tiền tệ]}
  - {id: dispute_status, column: dispute_status, description: Dispute status., synonyms: [status, trạng thái]}
  - {id: raised_date_key, column: raised_date_key, description: Date the dispute was raised., synonyms: [date, ngày tranh chấp]}
metrics:
  - {id: dispute_count, description: Number of case-linked disputes., expression: "COUNT(*)", aggregation: count, format: integer, supported_dimensions: [case_id, reason_code, currency_code, dispute_status, raised_date_key], time_field: raised_at}
  - {id: dispute_amount_total, description: Total disputed amount; group or filter by currency_code., expression: "SUM(amount)", aggregation: sum, format: currency_by_currency_code, supported_dimensions: [case_id, reason_code, currency_code, dispute_status, raised_date_key], time_field: raised_at}
