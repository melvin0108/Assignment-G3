  - {name: is_unknown, physical_type: boolean, description: Whether this is the UNKNOWN reason member., semantic_role: quality_flag, tags: [unknown_member], synonyms: [unknown reason], allowed_values: [true, false]}
  - {name: pipeline_run_id, physical_type: string, description: Gold pipeline run identifier., semantic_role: lineage, tags: [metadata], synonyms: [run id]}
