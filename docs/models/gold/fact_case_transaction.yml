schema_version: "1.0.0"
model: fact_case_transaction
table: gold.fact_case_transaction
description: Case-linked transaction activity with natural business identifiers and AI-safe enrichment.
domain: transaction_investigation
type: fact
grain: one row per case_id and transaction_id
tags: [gold, transaction, ai_safe]
synonyms: [case transaction, giao dịch trong hồ sơ]
sources: [silver.case_transactions, silver.transactions]
ai_access: {classification: ai_allowed, pii_safe: true}
primary_key: [case_id, transaction_id]
relationships:
  - {target_model: gold.dim_case, cardinality: many_to_one, join_columns: [{from: case_id, to: case_id}]}
  - {target_model: gold.dim_merchant, cardinality: many_to_one, join_columns: [{from: merchant_id, to: merchant_id}]}
  - {target_model: gold.dim_channel, cardinality: many_to_one, join_columns: [{from: channel_code, to: channel_code}]}
  - {target_model: gold.dim_currency, cardinality: many_to_one, join_columns: [{from: currency_code, to: currency_code}]}
  - {target_model: gold.dim_date, cardinality: many_to_one, join_columns: [{from: transaction_date_key, to: date_key}]}
columns:
  - {name: case_id, physical_type: string, description: Natural investigation case identifier., semantic_role: primary_key, tags: [identifier], synonyms: [case, hồ sơ]}
  - {name: transaction_id, physical_type: string, description: Natural transaction identifier., semantic_role: primary_key, tags: [identifier], synonyms: [transaction, giao dịch]}
  - {name: merchant_id, physical_type: string, description: Merchant business identifier; UNKNOWN means unresolved enrichment., semantic_role: foreign_key, tags: [merchant], synonyms: [merchant, người bán]}
  - {name: channel_code, physical_type: string, description: Transaction channel code; UNKNOWN means unresolved enrichment., semantic_role: foreign_key, tags: [channel], synonyms: [channel, kênh]}
  - {name: currency_code, physical_type: string, description: Transaction currency; monetary metrics must group or filter by it., semantic_role: foreign_key, tags: [currency], synonyms: [currency, tiền tệ]}
  - {name: transaction_date_key, physical_type: int, description: yyyyMMdd transaction date key; 0 means UNKNOWN., semantic_role: foreign_key, tags: [date], synonyms: [transaction date, ngày giao dịch]}
  - {name: amount, physical_type: "decimal(18,2)", description: Transaction amount in currency_code., semantic_role: measure, tags: [amount, currency], synonyms: [transaction amount, số tiền]}
  - {name: txn_ts, physical_type: timestamp, description: Transaction event time., semantic_role: time, tags: [transaction], synonyms: [transaction time, thời gian giao dịch]}
  - {name: transaction_status, physical_type: string, description: Current transaction status., semantic_role: dimension, tags: [transaction], synonyms: [status, trạng thái giao dịch]}
  - {name: pipeline_run_id, physical_type: string, description: Gold pipeline run identifier., semantic_role: lineage, tags: [metadata], synonyms: [run id]}
  - {name: batch_id, physical_type: bigint, description: Source snapshot batch identifier., semantic_role: lineage, tags: [metadata], synonyms: [batch]}
  - {name: last_refreshed_at, physical_type: timestamp, description: Time the Gold row was refreshed., semantic_role: time, tags: [metadata], synonyms: [refresh time]}
  - {name: quality_status, physical_type: string, description: Row quality outcome., semantic_role: quality_flag, tags: [metadata], synonyms: [data quality], allowed_values: [pass, partial]}
  - {name: warning_flags, physical_type: "array<string>", description: Machine-readable data quality warnings., semantic_role: quality_flag, tags: [metadata], synonyms: [warnings]}
  - {name: source_references, physical_type: "array<struct<source_table:string,source_record_id:string>>", description: Source records used to build the row., semantic_role: lineage, tags: [metadata], synonyms: [lineage]}
  - {name: usage_restrictions, physical_type: string, description: Consumer access classification., semantic_role: access_policy, tags: [metadata], synonyms: [AI access], allowed_values: [ai_allowed]}
dimensions:
  - {id: case_id, column: case_id, description: Investigation case., synonyms: [case, hồ sơ]}
  - {id: merchant_id, column: merchant_id, description: Merchant., synonyms: [merchant, người bán]}
  - {id: channel_code, column: channel_code, description: Transaction channel., synonyms: [channel, kênh]}
  - {id: currency_code, column: currency_code, description: Currency required for monetary aggregation., synonyms: [currency, tiền tệ]}
  - {id: transaction_status, column: transaction_status, description: Transaction status., synonyms: [status, trạng thái]}
  - {id: transaction_date_key, column: transaction_date_key, description: Transaction date., synonyms: [date, ngày giao dịch]}
metrics:
  - {id: transaction_count, description: Distinct case-linked transaction count., expression: "COUNT(DISTINCT case_id, transaction_id)", aggregation: count_distinct, format: integer, supported_dimensions: [case_id, merchant_id, channel_code, currency_code, transaction_status, transaction_date_key], time_field: txn_ts}
  - {id: transaction_amount_total, description: Total transaction amount; group or filter by currency_code., expression: "SUM(amount)", aggregation: sum, format: currency_by_currency_code, supported_dimensions: [case_id, merchant_id, channel_code, currency_code, transaction_status, transaction_date_key], time_field: txn_ts}
  - {id: transaction_amount_average, description: Average transaction amount; group or filter by currency_code., expression: "AVG(amount)", aggregation: average, format: currency_by_currency_code, supported_dimensions: [case_id, merchant_id, channel_code, currency_code, transaction_status, transaction_date_key], time_field: txn_ts}
