schema_version: "1.0.0"
model: dim_date
table: gold.dim_date
description: Calendar dimension with yyyyMMdd keys and key 0 reserved for an unknown date.
domain: transaction_investigation
type: dimension
grain: one row per calendar date, plus the unknown date member
tags: [gold, calendar, ai_safe]
synonyms: [date dimension, calendar, ngày]
sources: [silver.date_dim]
ai_access: {classification: ai_allowed, pii_safe: true}
primary_key: [date_key]
relationships: []
columns:
  - {name: date_key, physical_type: int, description: Calendar key in yyyyMMdd form; 0 means UNKNOWN., semantic_role: primary_key, tags: [identifier, date], synonyms: [date id, khóa ngày]}
  - {name: date_id, physical_type: date, description: Calendar date., semantic_role: time, tags: [date], synonyms: [calendar date, ngày]}
  - {name: year, physical_type: int, description: Calendar year., semantic_role: dimension, tags: [time], synonyms: [năm]}
  - {name: month, physical_type: int, description: Calendar month number., semantic_role: dimension, tags: [time], synonyms: [tháng]}
  - {name: quarter, physical_type: int, description: Calendar quarter number., semantic_role: dimension, tags: [time], synonyms: [quý]}
  - {name: is_weekend, physical_type: boolean, description: Whether the date falls on a weekend., semantic_role: attribute, tags: [time], synonyms: [weekend, cuối tuần], allowed_values: [true, false]}
  - {name: is_unknown, physical_type: boolean, description: Whether this is the UNKNOWN date member., semantic_role: quality_flag, tags: [unknown_member], synonyms: [unknown date], allowed_values: [true, false]}
  - {name: pipeline_run_id, physical_type: string, description: Gold pipeline run identifier., semantic_role: lineage, tags: [metadata], synonyms: [run id]}
  - {name: batch_id, physical_type: bigint, description: Source snapshot batch identifier., semantic_role: lineage, tags: [metadata], synonyms: [batch]}
  - {name: last_refreshed_at, physical_type: timestamp, description: Time the Gold row was refreshed., semantic_role: time, tags: [metadata], synonyms: [refresh time]}
  - {name: quality_status, physical_type: string, description: Row quality outcome., semantic_role: quality_flag, tags: [metadata], synonyms: [data quality], allowed_values: [pass, partial]}
  - {name: warning_flags, physical_type: "array<string>", description: Machine-readable data quality warnings., semantic_role: quality_flag, tags: [metadata], synonyms: [warnings]}
  - {name: source_references, physical_type: "array<struct<source_table:string,source_record_id:string>>", description: Source records used to build the row., semantic_role: lineage, tags: [metadata], synonyms: [lineage]}
  - {name: usage_restrictions, physical_type: string, description: Consumer access classification., semantic_role: access_policy, tags: [metadata], synonyms: [AI access], allowed_values: [ai_allowed]}
dimensions:
  - {id: date_key, column: date_key, description: Calendar date key used for grouping and filtering., synonyms: [date, ngày]}
  - {id: year, column: year, description: Calendar year., synonyms: [năm]}
  - {id: month, column: month, description: Calendar month., synonyms: [tháng]}
  - {id: quarter, column: quarter, description: Calendar quarter., synonyms: [quý]}
metrics: []
