schema_version: "1.0.0"
model: dim_consumer_account
table: gold.dim_consumer_account
description: Protected ownership broker for authenticated Consumer account queries.
domain: consumer_self_service
type: dimension
grain: one row per customer_id and account_id
tags: [gold, consumer, protected_broker_source]
synonyms: [consumer account, my account]
sources: [silver.accounts, silver.customers]
ai_access: {classification: internal_only, pii_safe: true}
primary_key: [customer_id, account_id]
relationships: []
columns:
  - {name: customer_id, physical_type: string, description: Internal customer scope key; never returned to the agent., semantic_role: broker_key, tags: [restricted], synonyms: [customer scope]}
  - {name: account_id, physical_type: string, description: Internal account scope key; never returned to the agent., semantic_role: broker_key, tags: [restricted], synonyms: [account scope]}
  - {name: account_reference, physical_type: string, description: Masked account display reference containing only a suffix., semantic_role: dimension, tags: [masked], synonyms: [account]}
  - {name: product_type, physical_type: string, description: Account product type., semantic_role: dimension, tags: [], synonyms: [account type]}
  - {name: account_status, physical_type: string, description: Current account status., semantic_role: dimension, tags: [], synonyms: [status]}
  - {name: currency_code, physical_type: string, description: Account currency code., semantic_role: dimension, tags: [currency], synonyms: [currency]}
  - {name: open_date, physical_type: date, description: Date the account was opened., semantic_role: time, tags: [], synonyms: [opened]}
  - {name: pipeline_run_id, physical_type: string, description: Gold pipeline run identifier., semantic_role: lineage, tags: [metadata], synonyms: [run id]}
  - {name: batch_id, physical_type: bigint, description: Source snapshot batch identifier., semantic_role: lineage, tags: [metadata], synonyms: [batch]}
  - {name: last_refreshed_at, physical_type: timestamp, description: Time the Gold row was refreshed., semantic_role: time, tags: [metadata], synonyms: [data as of]}
  - {name: quality_status, physical_type: string, description: Row quality outcome., semantic_role: quality_flag, tags: [metadata], synonyms: [data quality], allowed_values: [pass, partial]}
  - {name: warning_flags, physical_type: "array<string>", description: Machine-readable data quality warnings., semantic_role: quality_flag, tags: [metadata], synonyms: [warnings]}
  - {name: source_references, physical_type: "array<struct<source_table:string,source_record_id:string>>", description: Protected source lineage., semantic_role: lineage, tags: [metadata, restricted], synonyms: [lineage]}
  - {name: usage_restrictions, physical_type: string, description: Broker source access classification., semantic_role: access_policy, tags: [metadata], synonyms: [access policy], allowed_values: [internal_only]}
dimensions:
  - {id: account_status, column: account_status, description: Current account status., synonyms: [status]}
  - {id: product_type, column: product_type, description: Account product type., synonyms: [account type]}
  - {id: currency_code, column: currency_code, description: Account currency., synonyms: [currency]}
metrics:
  - {id: account_count, description: Number of customer-owned accounts., expression: "COUNT(1)", aggregation: count, format: integer, supported_dimensions: [account_status, product_type, currency_code], time_field: open_date}
  - {id: active_account_count, description: Number of active customer-owned accounts., expression: "COUNT(1) FILTER (WHERE account_status = 'active')", aggregation: count, format: integer, supported_dimensions: [account_status, product_type, currency_code], time_field: open_date}
