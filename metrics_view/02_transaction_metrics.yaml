version: 1.1
comment: Transaction activity and merchant-risk exposure with all Gold relationship joins.
source: g3_catalog.gold.fact_case_transaction
joins:
  - {name: investigation_case, source: g3_catalog.gold.dim_case, 'on': source.case_id = investigation_case.case_id}
  - {name: merchant, source: g3_catalog.gold.dim_merchant, 'on': source.merchant_id = merchant.merchant_id}
  - {name: channel, source: g3_catalog.gold.dim_channel, 'on': source.channel_code = channel.channel_code}
  - {name: currency, source: g3_catalog.gold.dim_currency, 'on': source.currency_code = currency.currency_code}
  - {name: transaction_date, source: g3_catalog.gold.dim_date, 'on': source.transaction_date_key = transaction_date.date_key}
fields:
  - {name: case_id, expr: source.case_id, comment: Natural investigation case identifier., synonyms: [case]}
  - {name: transaction_id, expr: source.transaction_id, comment: Natural transaction identifier., synonyms: [transaction]}
  - {name: merchant_id, expr: source.merchant_id, comment: Merchant business identifier., synonyms: [merchant]}
  - {name: channel_code, expr: source.channel_code, comment: Transaction channel code., synonyms: [channel]}
  - {name: currency_code, expr: source.currency_code, comment: Currency required for monetary aggregation., synonyms: [currency]}
  - {name: transaction_date_key, expr: source.transaction_date_key, comment: Transaction date key., synonyms: [transaction date]}
  - {name: amount, expr: source.amount, comment: Transaction amount in currency., synonyms: [transaction amount]}
  - {name: txn_ts, expr: source.txn_ts, comment: Transaction event time., synonyms: [transaction time]}
  - {name: transaction_status, expr: source.transaction_status, comment: Current transaction status., synonyms: [transaction status]}
  - {name: pipeline_run_id, expr: source.pipeline_run_id, comment: Gold pipeline run identifier., synonyms: [run id]}
  - {name: batch_id, expr: source.batch_id, comment: Source snapshot batch identifier., synonyms: [batch]}
  - {name: last_refreshed_at, expr: source.last_refreshed_at, comment: Gold row refresh time., synonyms: [refresh time]}
  - {name: quality_status, expr: source.quality_status, comment: Row quality outcome., synonyms: [data quality]}
  - {name: usage_restrictions, expr: source.usage_restrictions, comment: Consumer access classification., synonyms: [AI access]}
  - {name: case_priority, expr: investigation_case.priority, comment: Joined case priority., synonyms: [case priority]}
  - {name: case_status_code, expr: investigation_case.status_code, comment: Joined case status., synonyms: [case status]}
  - {name: merchant_name, expr: merchant.merchant_name, comment: Joined merchant name., synonyms: [merchant]}
  - {name: mcc, expr: merchant.mcc, comment: Merchant category code., synonyms: [merchant category code]}
  - {name: category_name, expr: merchant.category_name, comment: Merchant category name., synonyms: [merchant category]}
  - {name: category_group, expr: merchant.category_group, comment: Merchant category group., synonyms: [category group]}
  - {name: country, expr: merchant.country, comment: Merchant country., synonyms: [merchant country]}
  - {name: risk_rating, expr: merchant.risk_rating, comment: Merchant risk rating., synonyms: [merchant risk]}
  - {name: merchant_status, expr: merchant.merchant_status, comment: Merchant status., synonyms: [merchant status]}
  - {name: channel_name, expr: channel.channel_name, comment: Joined channel name., synonyms: [channel name]}
  - {name: currency_name, expr: currency.currency_name, comment: Joined currency name., synonyms: [currency name]}
  - {name: transaction_calendar_date, expr: transaction_date.date_id, comment: Joined transaction calendar date., synonyms: [calendar date]}
measures:
  - {name: transaction_count, expr: "COUNT(DISTINCT source.case_id, source.transaction_id)", comment: Distinct case-linked transaction count., synonyms: [transaction count]}
  - {name: transaction_amount_total, expr: SUM(source.amount), comment: Total transaction amount; group or filter by currency., synonyms: [total transaction amount]}
  - {name: transaction_amount_average, expr: AVG(source.amount), comment: Average transaction amount; group or filter by currency., synonyms: [average transaction amount]}
