version: 1.1
comment: Channel reference fields for governed filtering and grouping; intentionally no artificial measures.
source: g3_catalog.gold.dim_channel
fields:
  - {name: channel_code, expr: source.channel_code, comment: Natural channel identifier., synonyms: [channel code]}
  - {name: channel_name, expr: source.channel_name, comment: Business-facing channel name., synonyms: [channel]}
  - {name: is_unknown, expr: source.is_unknown, comment: Whether this is the UNKNOWN channel member., synonyms: [unknown channel]}
  - {name: pipeline_run_id, expr: source.pipeline_run_id, comment: Gold pipeline run identifier., synonyms: [run id]}
  - {name: batch_id, expr: source.batch_id, comment: Source snapshot batch identifier., synonyms: [batch]}
  - {name: last_refreshed_at, expr: source.last_refreshed_at, comment: Gold row refresh time., synonyms: [refresh time]}
  - {name: quality_status, expr: source.quality_status, comment: Row quality outcome., synonyms: [data quality]}
  - {name: usage_restrictions, expr: source.usage_restrictions, comment: Consumer access classification., synonyms: [AI access]}
