version: 1.1
comment: Authorization outcome metrics with case and calendar attributes.
source: g3_catalog.gold.fact_authorization_attempt
joins:
  - {name: investigation_case, source: g3_catalog.gold.dim_case, 'on': source.case_id = investigation_case.case_id}
  - {name: authorization_date, source: g3_catalog.gold.dim_date, 'on': source.authorization_date_key = authorization_date.date_key}
fields:
  - {name: case_id, expr: source.case_id, comment: Natural investigation case identifier., synonyms: [case]}
  - {name: transaction_id, expr: source.transaction_id, comment: Natural transaction identifier., synonyms: [transaction]}
  - {name: attempt_id, expr: source.attempt_id, comment: Authorization attempt identifier., synonyms: [authorization attempt]}
  - {name: authorization_date_key, expr: source.authorization_date_key, comment: Authorization date key., synonyms: [authorization date]}
  - {name: decision, expr: source.decision, comment: Recorded authorization decision., synonyms: [authorization outcome]}
  - {name: decline_reason, expr: source.decline_reason, comment: Recorded decline reason., synonyms: [decline reason]}
  - {name: auth_ts, expr: source.auth_ts, comment: Authorization event time., synonyms: [authorization time]}
  - {name: pipeline_run_id, expr: source.pipeline_run_id, comment: Gold pipeline run identifier., synonyms: [run id]}
  - {name: batch_id, expr: source.batch_id, comment: Source snapshot batch identifier., synonyms: [batch]}
  - {name: last_refreshed_at, expr: source.last_refreshed_at, comment: Gold row refresh time., synonyms: [refresh time]}
  - {name: quality_status, expr: source.quality_status, comment: Row quality outcome., synonyms: [data quality]}
  - {name: usage_restrictions, expr: source.usage_restrictions, comment: Consumer access classification., synonyms: [AI access]}
  - {name: case_priority, expr: investigation_case.priority, comment: Joined case priority., synonyms: [case priority]}
  - {name: authorization_calendar_date, expr: authorization_date.date_id, comment: Joined authorization calendar date., synonyms: [calendar date]}
measures:
  - {name: authorization_attempt_count, expr: COUNT(*), comment: Number of authorization attempts., synonyms: [authorization attempts]}
  - {name: authorization_approval_rate, expr: AVG(CASE WHEN source.decision = 'approved' THEN 1.0 ELSE 0.0 END), comment: Approved attempts divided by all attempts., synonyms: [approval rate]}
  - {name: authorization_decline_rate, expr: AVG(CASE WHEN source.decision = 'declined' THEN 1.0 ELSE 0.0 END), comment: Declined attempts divided by all attempts., synonyms: [decline rate]}
