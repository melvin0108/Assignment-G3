version: 1.1
comment: Chargeback activity metrics with all documented Gold joins.
source: g3_catalog.gold.fact_chargeback
joins:
  - {name: investigation_case, source: g3_catalog.gold.dim_case, 'on': source.case_id = investigation_case.case_id}
  - {name: dispute, source: g3_catalog.gold.fact_dispute, 'on': source.case_id = dispute.case_id AND source.dispute_id = dispute.dispute_id}
  - {name: currency, source: g3_catalog.gold.dim_currency, 'on': source.currency_code = currency.currency_code}
  - {name: processed_date, source: g3_catalog.gold.dim_date, 'on': source.processed_date_key = processed_date.date_key}
fields:
  - {name: case_id, expr: source.case_id, comment: Natural investigation case identifier., synonyms: [case]}
  - {name: transaction_id, expr: source.transaction_id, comment: Natural transaction identifier., synonyms: [transaction]}
  - {name: dispute_id, expr: source.dispute_id, comment: Natural dispute identifier., synonyms: [dispute]}
  - {name: chargeback_id, expr: source.chargeback_id, comment: Natural chargeback identifier., synonyms: [chargeback]}
  - {name: currency_code, expr: source.currency_code, comment: Currency required for monetary aggregation., synonyms: [currency]}
  - {name: processed_date_key, expr: source.processed_date_key, comment: Chargeback processed date key., synonyms: [processed date]}
  - {name: scheme, expr: source.scheme, comment: Card scheme., synonyms: [card scheme]}
  - {name: amount, expr: source.amount, comment: Chargeback amount in currency., synonyms: [chargeback amount]}
  - {name: chargeback_stage, expr: source.chargeback_stage, comment: Current chargeback stage., synonyms: [chargeback stage]}
  - {name: processed_at, expr: source.processed_at, comment: Chargeback processing timestamp., synonyms: [processed time]}
  - {name: pipeline_run_id, expr: source.pipeline_run_id, comment: Gold pipeline run identifier., synonyms: [run id]}
  - {name: batch_id, expr: source.batch_id, comment: Source snapshot batch identifier., synonyms: [batch]}
  - {name: last_refreshed_at, expr: source.last_refreshed_at, comment: Gold row refresh time., synonyms: [refresh time]}
  - {name: quality_status, expr: source.quality_status, comment: Row quality outcome., synonyms: [data quality]}
  - {name: usage_restrictions, expr: source.usage_restrictions, comment: Consumer access classification., synonyms: [AI access]}
  - {name: case_priority, expr: investigation_case.priority, comment: Joined case priority., synonyms: [case priority]}
  - {name: dispute_status, expr: dispute.dispute_status, comment: Joined dispute status., synonyms: [dispute status]}
  - {name: currency_name, expr: currency.currency_name, comment: Joined currency name., synonyms: [currency name]}
  - {name: processed_calendar_date, expr: processed_date.date_id, comment: Joined processed calendar date., synonyms: [calendar date]}
measures:
  - {name: chargeback_count, expr: COUNT(*), comment: Number of case-linked chargebacks., synonyms: [number of chargebacks]}
  - {name: chargeback_amount_total, expr: SUM(source.amount), comment: Total chargeback amount; group or filter by currency., synonyms: [total chargeback amount]}
